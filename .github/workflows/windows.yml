# Windows: тесты и проверка интерфейса на каждый push.
# • тесты xUnit;
# • --rerender — каждый экран открывается и перерисовывается трижды (ловит «already has a visual parent» и прочие вылеты);
# • --cliptest в размере телефона 360×780 — ни одна надпись не обрезана и не уходит за край экрана;
# • снимки главных экранов (компьютер и телефон) — артефакт windows-snapshots.
# Звук и синтез речи в этих режимах выключены, прогресс не записывается.
name: Windows

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:


# новый push в ту же ветку отменяет ещё идущую проверку старого коммита
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Тесты
        run: dotnet test tests/Kotodama.XTests -c Release

      - name: Сборка (Debug — в ней есть отладочные флаги)
        run: dotnet build xplat/Kotodama.csproj -c Debug -o build

      - name: Перерисовка всех экранов (компьютер и телефон)
        run: |
          mkdir -p snaps
          timeout 300 ./build/Kotodama.exe --rerender snaps/rerender.txt || true
          KOTODAMA_PHONE=360x780 timeout 300 ./build/Kotodama.exe --phone --rerender snaps/rerender-phone.txt || true
          cat snaps/rerender.txt snaps/rerender-phone.txt
          test -s snaps/rerender.txt && test -s snaps/rerender-phone.txt
          ! grep -h FAIL snaps/rerender.txt snaps/rerender-phone.txt

      - name: Обрезанный текст на телефоне
        run: |
          mkdir -p snaps/phone
          KOTODAMA_PHONE=360x780 KOTODAMA_CLIPSNAP=snaps/phone timeout 400 ./build/Kotodama.exe --phone --cliptest snaps/cliptest.txt || true
          cat snaps/cliptest.txt
          test -s snaps/cliptest.txt
          # «многоточие» в превью — намеренно; всё остальное (за краем, сжат, шире, выше) — ошибка вёрстки
          KOTODAMA_PHONE=320x640 timeout 400 ./build/Kotodama.exe --phone --cliptest snaps/cliptest-320.txt || true
          cat snaps/cliptest-320.txt
          test -s snaps/cliptest-320.txt
          ! grep -E "за краем|сжат|столбиком|разрыв слова|наложение|шире на|выше на|FAIL" snaps/cliptest.txt snaps/cliptest-320.txt

      - name: Обрезанный текст на компьютере (минимальный размер окна)
        run: |
          KOTODAMA_SIZE=1020x680 timeout 400 ./build/Kotodama.exe --cliptest snaps/cliptest-desktop.txt || true
          test -s snaps/cliptest-desktop.txt
          # «сжат» — признак для узкого экрана телефона, на компьютере это обычный перенос в колонке
          ! grep -E "за краем|шире на|выше на|FAIL" snaps/cliptest-desktop.txt

      - name: Снимки экранов
        if: always()
        run: |
          for page in home path words grammar speech settings dict kanji dialogs reader stats; do
            timeout 60 ./build/Kotodama.exe --page $page --snap snaps/$page.png || true
            KOTODAMA_PHONE=360x780 timeout 60 ./build/Kotodama.exe --phone --page $page --snap snaps/phone-$page.png || true
          done
          # те же главные экраны во всех темах: светлая, «Ночь», высокий контраст (Е3)
          for theme in light night contrast; do
            for page in home path words speech dict stats; do
              timeout 60 ./build/Kotodama.exe --$theme --page $page --snap snaps/$theme-$page.png || true
            done
          done
          ls -la snaps
          cat "$APPDATA/Matsubakira/crash.log" 2>/dev/null || true

      - name: Сравнение с эталонами (tests/snapshots)
        run: |
          pip install --quiet pillow
          mkdir -p tests/snapshots
          python -X utf8 tools/snapdiff.py snaps tests/snapshots 2.0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-snapshots
          path: snaps/
