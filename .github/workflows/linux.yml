# Linux-версия Kotodama (Avalonia): сборка, тесты, проверка запуска и архив для релиза.
# • push / pull request — собрать, прогнать тесты, запустить в виртуальном дисплее и сохранить снимки экрана;
# • публикация релиза — дополнительно прикрепить Kotodama-linux-x64.tar.gz к этому релизу;
# • ручной запуск (Actions → Linux → Run workflow) с указанием тега — прикрепить архив к уже вышедшему релизу.
name: Linux

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, к которому прикрепить архив (например, v1.1.0). Пусто — только собрать."
        required: false

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Шрифты и библиотеки для запуска интерфейса
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth fonts-noto-cjk fonts-noto-color-emoji libice6 libsm6 libfontconfig1 pulseaudio-utils

      - name: Тесты
        run: dotnet test tests/Kotodama.XTests -c Release

      - name: Проверка запуска (снимки экрана в виртуальном дисплее)
        run: |
          dotnet build xplat/Kotodama.csproj -c Debug
          mkdir -p snaps
          # каждый экран: код возврата 0 и непустой снимок — падение при запуске роняет сборку (Е2)
          fail=0
          for page in home words speech kanji settings path grammar dialogs; do
            timeout 120 xvfb-run -a -s "-screen 0 1400x900x24" dotnet xplat/bin/Debug/net10.0/Kotodama.dll --page $page --snap snaps/$page.png || { echo "::error::экран $page: код $?"; fail=1; }
            test -s snaps/$page.png || { echo "::error::нет снимка $page"; fail=1; }
          done
          for what in flash writing pairs; do
            timeout 120 xvfb-run -a -s "-screen 0 1400x900x24" dotnet xplat/bin/Debug/net10.0/Kotodama.dll --open $what --snap snaps/open-$what.png || { echo "::error::$what: код $?"; fail=1; }
            test -s snaps/open-$what.png || { echo "::error::нет снимка $what"; fail=1; }
          done
          ls -la snaps
          cat ~/.config/Matsubakira/crash.log 2>/dev/null && fail=1
          exit $fail

      - name: Сравнение с эталонами Linux (tests/snapshots-linux)
        run: |
          pip install --quiet pillow
          # эталоны Linux отдельные: шрифты и сглаживание отличаются от Windows. Нет папки — первый прогон их создаёт (артефакт)
          if [ -d tests/snapshots-linux ]; then python3 -X utf8 tools/snapdiff.py snaps tests/snapshots-linux 2.0; else echo "эталонов Linux пока нет — возьми их из артефакта linux-snapshots"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-snapshots
          path: snaps/

      - name: Сборка Linux x64
        run: |
          dotnet publish xplat/Kotodama.csproj -c Release -r linux-x64 --self-contained true -o out/Kotodama-linux
          python3 tools/pack_linux.py out/Kotodama-linux Kotodama-linux-x64.tar.gz

      - name: AppImage — один файл, запускается на любом дистрибутиве, со значком и ярлыком (8.1)
        run: |
          set -e
          sudo apt-get install -y -qq desktop-file-utils >/dev/null  # appimagetool проверяет ярлык
          APP=Kotodama.AppDir
          mkdir -p $APP/usr/lib/kotodama
          cp -r out/Kotodama-linux/. $APP/usr/lib/kotodama/
          cp packaging/linux/kotodama.png $APP/kotodama.png
          sed 's|^Exec=.*|Exec=kotodama|; s|^Icon=.*|Icon=kotodama|' packaging/linux/kotodama.desktop > $APP/kotodama.desktop
          printf '%s\n' '#!/bin/sh' 'HERE="$(dirname "$(readlink -f "$0")")"' 'exec "$HERE/usr/lib/kotodama/Kotodama" "$@"' > $APP/AppRun
          chmod +x $APP/AppRun $APP/usr/lib/kotodama/Kotodama
          wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run $APP Kotodama-x86_64.AppImage
          ls -la Kotodama-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: Kotodama-linux-x64
          path: |
            Kotodama-linux-x64.tar.gz
            Kotodama-x86_64.AppImage

      - name: Прикрепить к релизу
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        # архив пересобран — строку в SHA256SUMS обновляем, иначе автообновление на Linux отвергнет его
        run: |
          gh release upload "$TAG" Kotodama-linux-x64.tar.gz Kotodama-x86_64.AppImage --clobber
          gh release download "$TAG" -p SHA256SUMS --clobber || touch SHA256SUMS
          grep -v " Kotodama-linux-x64.tar.gz$\| Kotodama-x86_64.AppImage$" SHA256SUMS > SHA256SUMS.new || true
          sha256sum Kotodama-linux-x64.tar.gz Kotodama-x86_64.AppImage >> SHA256SUMS.new
          mv SHA256SUMS.new SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
